name: Install NSS
description: Install NSS
branding:
  icon: shield
  color: purple

inputs:
  minimum-version:
    description: "Minimum required version of NSS, unless 'deps-only'. System NSS must be at least this version; a source build builds exactly this version."
    default: ""
  sha256:
    description: "SHA256 of the 'nss-<minimum-version>-with-nspr-<nspr-version>.tar.gz' release tarball, unless 'deps-only'."
    default: ""
  target:
    description: "Rust target triple to cross-compile for: i686-*-linux-gnu, or an Android target, which needs minimum-version 3.134 or later"
    default: ""
  android-api:
    description: "Android API level to build for (Android targets only)"
    default: "21"
  deps-only:
    description: "Install the NSS build toolchain but acquire no NSS, for callers that build their own checkout."
    default: "false"
  cache:
    description: "Whether to cache the NSS build artifacts"
    default: "true"
  sccache:
    description: Whether to enable sccache for NSS compilation caching
    default: "false"
  java-version:
    description: "Java version to install for Android builds"
    default: "21"

outputs:
  ndk-version:
    description: "Version of the Android NDK that NSS was built with (Android builds only)"
    value: ${{ steps.validate.outputs.ndk-version }}

runs:
  using: composite
  steps:
    # Turn the conditional requirements into loud failures here, rather than an
    # empty version 404ing on the release URL further down.
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        ANDROID_API: ${{ inputs.android-api }}
        DEPS_ONLY: ${{ inputs.deps-only }}
        MIN_VERSION: ${{ inputs.minimum-version }}
        SHA256: ${{ inputs.sha256 }}
        TARGET_PLATFORM: ${{ inputs.target }}
      run: |
        if [ "$DEPS_ONLY" != "true" ]; then
          [ -n "$MIN_VERSION" ] && [ -n "$SHA256" ] ||
            { echo "::error::minimum-version and sha256 are required unless deps-only is true"; exit 1; }
        fi
        # Build does not run in deps-only mode, so vet the target here instead,
        # and work out the build.sh arguments for it while at it.
        CROSS_FLAGS=""
        case "$TARGET_PLATFORM" in
          *-android*)
            case "$TARGET_PLATFORM" in
              aarch64-*) ARCH=arm64 ;;
              arm-* | armv7-* | thumbv7neon-*) ARCH=arm ;;
              x86_64-*) ARCH=x64 ;;
              i686-*) ARCH=ia32 ;;
              *) echo "::error::Unsupported Android target: $TARGET_PLATFORM"; exit 1 ;;
            esac
            [[ "$ANDROID_API" =~ ^[0-9]+$ ]] ||
              { echo "::error::android-api must be a number, got '$ANDROID_API'"; exit 1; }
            # Firefox builds with this NDK too; keep in step with NDK_VERSION in
            # its python/mozboot/mozboot/android.py, which names it by release
            # (r30), whereas sdkmanager wants the full version.
            NDK_VERSION="30.0.16248370"
            echo "ndk-version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
            # The NDK and API level change the build without changing the target.
            echo "cache-suffix=-ndk$NDK_VERSION-api$ANDROID_API" >> "$GITHUB_OUTPUT"
            CROSS_FLAGS=" --target-os=android --android-api=$ANDROID_API -t $ARCH" ;;
          i686-*-linux-gnu) CROSS_FLAGS=" -t ia32" ;;
          i?86-*)
            echo "::error::Unsupported 32-bit x86 target: $TARGET_PLATFORM (only i686-*-linux-gnu is handled)"
            exit 1 ;;
        esac
        echo "cross-flags=$CROSS_FLAGS" >> "$GITHUB_OUTPUT"

    - name: Install system NSS (Linux)
      shell: bash
      if: ${{ runner.os == 'Linux' && inputs.target == '' && inputs.deps-only != 'true' }}
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        [ "$APT_UPDATED" ] || sudo apt-get update && echo "APT_UPDATED=1" >> "$GITHUB_ENV"
        sudo apt-get install -y --no-install-recommends libnss3-dev

    - name: Install system NSS (MacOS)
      shell: bash
      if: ${{ runner.os == 'MacOS' && inputs.target == '' && inputs.deps-only != 'true' }}
      run: |
        [ "$BREW_UPDATED" ] || brew update && echo "BREW_UPDATED=1" >> "$GITHUB_ENV"
        brew install nss || echo "::notice::Homebrew NSS unavailable; building from source"

    - name: Check system NSS version
      id: system_nss
      env:
        MIN_VERSION: ${{ inputs.minimum-version }}
      shell: bash
      if: ${{ runner.os != 'Windows' && inputs.target == '' && inputs.deps-only != 'true' }}
      run: |
        nss_version=$(pkg-config --modversion nss 2>/dev/null) || true
        if ! pkg-config --atleast-version "$MIN_VERSION" nss; then
          echo "System NSS needs ${MIN_VERSION}, got ${nss_version:-pkg-config error}"
          exit 0
        fi
        echo "System NSS is suitable: $nss_version"
        echo "suitable=1" >> "$GITHUB_OUTPUT"

    - name: Retrieve NSS
      id: nss
      if: ${{ !steps.system_nss.outputs.suitable && inputs.deps-only != 'true' }}
      shell: bash
      env:
        NSS_VERSION: ${{ inputs.minimum-version }}
        NSS_SHA256: ${{ inputs.sha256 }}
        TARGET_PLATFORM: ${{ inputs.target }}
      run: |
        NSS_TAG="${NSS_VERSION//./_}"
        RELEASE_DIR="https://ftp.mozilla.org/pub/security/nss/releases/NSS_${NSS_TAG}_RTM/src"

        # The tarball name encodes the bundled NSPR version, so resolve it from the
        # pinned checksum rather than guessing a filename: this also means the pin
        # is the only source of truth for which NSPR version gets built.
        SUMS=$(curl -fsSL "$RELEASE_DIR/SHA256SUMS") || { echo "::error::Failed to fetch $RELEASE_DIR/SHA256SUMS"; exit 1; }
        LINE=$(grep -F -m1 "${NSS_SHA256} " <<< "$SUMS" || true)
        read -r _ FILENAME <<< "$LINE"
        FILENAME="${FILENAME#\*}"
        if [ -z "$FILENAME" ]; then
          echo "::error::No artifact in NSS_${NSS_TAG}_RTM matches sha256 ${NSS_SHA256}."
          exit 1
        fi
        case "$FILENAME" in
          nss-*-with-nspr-*.tar.gz) ;;
          *) echo "::error::Resolved artifact $FILENAME does not bundle NSPR."; exit 1 ;;
        esac
        NSPR_VERSION="${FILENAME#nss-*-with-nspr-}"
        NSPR_VERSION="${NSPR_VERSION%.tar.gz}"

        echo "Retrieving $FILENAME from $RELEASE_DIR/$FILENAME"
        curl --fail -L -o nss.tar.gz "$RELEASE_DIR/$FILENAME"
        if command -v sha256sum &>/dev/null; then
          actual=$(sha256sum nss.tar.gz | cut -d' ' -f1)
        else
          actual=$(shasum -a 256 nss.tar.gz | cut -d' ' -f1)
        fi
        echo "sha256(nss.tar.gz): expected=$NSS_SHA256 actual=$actual"
        [ "$actual" = "$NSS_SHA256" ] || { echo "Checksum mismatch!"; exit 1; }
        tar xzf nss.tar.gz --strip-components=1
        rm nss.tar.gz
        case "$TARGET_PLATFORM" in
          *-android*)
            grep -q -e '--target-os=' nss/build.sh || {
              echo "::error::NSS $NSS_VERSION cannot be built for $TARGET_PLATFORM; that needs build.sh --target-os, from NSS 3.134"
              exit 1
            } ;;
        esac
        echo "version=$NSS_VERSION" >> "$GITHUB_OUTPUT"
        echo "nspr-version=$NSPR_VERSION" >> "$GITHUB_OUTPUT"

    - name: Store Ubuntu release code name (Linux)
      id: ubuntu_release
      shell: bash
      if: ${{ runner.os == 'Linux' && !steps.system_nss.outputs.suitable }}
      run: |
        # Store Ubuntu release codename for use in cache key.
        . /etc/os-release
        echo "codename=-$UBUNTU_CODENAME" >> "$GITHUB_OUTPUT"

    # Use restore-only here so PRs don't create redundant caches. PRs restore
    # from main; only main saves new caches. This reduces churn and evictions.
    # Downside: PRs that change NSS version/build will rebuild on every CI run.
    - name: Restore NSS cache
      id: cache
      if: ${{ inputs.cache == 'true' && !steps.system_nss.outputs.suitable && inputs.deps-only != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dist
        key: nss-${{ inputs.target || runner.os }}${{ steps.ubuntu_release.outputs.codename }}-${{ runner.arch }}-${{ steps.nss.outputs.version }}-${{ steps.nss.outputs.nspr-version }}${{ steps.validate.outputs.cache-suffix }}

    - name: Check if the build toolchain is needed
      id: check_build
      if: ${{ !steps.system_nss.outputs.suitable }}
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      shell: bash
      run: |
        if [ "$CACHE_HIT" != "true" ]; then
          echo "Build toolchain needed"
          echo "build_nss=1" >> "$GITHUB_OUTPUT"
        else
          echo "Using cached prebuilt NSS"
        fi

    - name: Use sccache
      # Prevent double-installation if the rust action already enabled sccache.
      if: ${{ inputs.sccache == 'true' && env.SCCACHE_ENABLED != '1' && steps.check_build.outputs.build_nss }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Enable sccache
      # Also triggers if the rust action already set SCCACHE_ENABLED, so that
      # both Rust and NSS builds benefit when both actions are used together.
      if: ${{ (inputs.sccache == 'true' || env.SCCACHE_ENABLED == '1') && steps.check_build.outputs.build_nss }}
      shell: bash
      env:
        RUNNER_OS: ${{ runner.os }}
      run: |
        {
          echo "SCCACHE_ENABLED=1"
          echo "SCCACHE_GHA_ENABLED=true"
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
        } >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "SCCACHE_CC=sccache cc" >> "$GITHUB_ENV"
          echo "SCCACHE_CXX=sccache c++" >> "$GITHUB_ENV"
        fi

    - name: Install build dependencies (Linux)
      shell: bash
      if: ${{ runner.os == 'Linux' && steps.check_build.outputs.build_nss }}
      env:
        DEBIAN_FRONTEND: noninteractive
        TARGET_PLATFORM: ${{ inputs.target }}
      run: |
        [ "$APT_UPDATED" ] || { sudo apt-get update && echo "APT_UPDATED=1" >> "$GITHUB_ENV"; }
        PACKAGES=(gyp ninja-build)
        if [[ "$TARGET_PLATFORM" == i686-*-linux-gnu ]]; then
          # g++-multilib pulls in gcc-multilib; lib32z1-dev is the 32-bit zlib.
          PACKAGES+=(g++-multilib lib32z1-dev)
        fi
        sudo apt-get install -y --no-install-recommends "${PACKAGES[@]}"

    - name: Install build dependencies (MacOS)
      shell: bash
      if: ${{ runner.os == 'MacOS' && steps.check_build.outputs.build_nss }}
      run: |
        brew install ninja
        # renovate: depName=gyp-next datasource=pypi
        echo "gyp-next==0.22.4" > req.txt
        python3 -m pip install --break-system-packages -r req.txt

    - name: Install build dependencies (Windows)
      shell: bash
      if: ${{ runner.os == 'Windows' && steps.check_build.outputs.build_nss }}
      run: |
        # shellcheck disable=SC2028
        {
          echo C:/msys64/usr/bin
          echo C:/msys64/mingw64/bin
          echo "$HOME/bin"
        } >> "$GITHUB_PATH"
        mkdir -p "$HOME/bin"
        # renovate: depName=firefox datasource=custom.firefox
        curl --proto '=https' --tlsv1.2 -o "$HOME/bin/nsinstall" -sSf https://hg-edge.mozilla.org/releases/mozilla-release/raw-file/FIREFOX_159_0_1_RELEASE/config/nsinstall.py
        echo "f88df5591ee50d6e86625efd6e5f9c7b0dd4cba61e27ab533b1990115e100caf  $HOME/bin/nsinstall" | sha256sum -c -
        sed -i '1i #! /usr/bin/env python3' "$HOME/bin/nsinstall"
        chmod +x "$HOME/bin/nsinstall"
        # gyp-next>=0.22.0 added Windows ARM64 target support (nodejs/gyp-next#331).
        # renovate: depName=gyp-next datasource=pypi
        echo "gyp-next==0.22.4" > req.txt
        # renovate: depName=mozfile datasource=pypi
        echo "mozfile==3.0.0" >> req.txt  # required by nsinstall.py
        python3 -m pip install -r req.txt

    - name: Set up MSVC (Windows)
      if: ${{ runner.os == 'Windows' && steps.check_build.outputs.build_nss }}
      uses: ilammy/msvc-dev-cmd@v1 # zizmor: ignore[unpinned-uses]
      # TODO: Would like to pin this, but the Mozilla org allowlist requires "ilammy/msvc-dev-cmd@v1*"
      # uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

    - name: Set up build environment (Windows)
      shell: bash
      if: ${{ runner.os == 'Windows' && steps.check_build.outputs.build_nss }}
      run: |
        # VSPATH stops NSS's msvc.sh redoing MSVC setup and overwriting these.
        case "${VSCMD_VER%%.*}" in 17) YEAR=2022 ;; 18) YEAR=2026 ;; *) YEAR= ;; esac
        if [ -z "$YEAR" ]; then
          echo "::warning::No gyp product year for MSVC '$VSCMD_VER'; leaving NSS to set up MSVC"
        else
          {
            echo "VSPATH=$VSINSTALLDIR"
            echo "GYP_MSVS_OVERRIDE_PATH=$VSINSTALLDIR"
            echo "GYP_MSVS_VERSION=$YEAR"
          } >> "$GITHUB_ENV"
        fi
        # See https://github.com/ilammy/msvc-dev-cmd#name-conflicts-with-shell-bash
        rm /usr/bin/link.exe || true

    - name: Set up environment
      id: setup_env
      shell: bash
      if: ${{ !steps.system_nss.outputs.suitable }}
      env:
        NSS_DIR: ${{ github.workspace }}/nss
        RUNNER_OS: ${{ runner.os }}
        CROSS_FLAGS: ${{ steps.validate.outputs.cross-flags }}
        WORKSPACE: ${{ github.workspace }}
      run:
        | # zizmor: ignore[github-env] We need to write to GITHUB_PATH on Windows.
        NSS_OUT="$WORKSPACE/dist/Release"
        # An optimized build still wants debug symbols and frame pointers, for
        # accurate CPU profiling. Not named CFLAGS, so it doesn't reach the rest
        # of the job; Build and deps-only callers export it around build.sh.
        CFLAGS_FOR_NSS=""
        [ "$RUNNER_OS" != "Windows" ] && CFLAGS_FOR_NSS="-ggdb3 -fno-omit-frame-pointer"
        # The Build step below and any deps-only caller driving build.sh
        # themselves must agree on how NSS gets built.
        # CROSS_FLAGS selects the target; build.sh would otherwise build for the host.
        FLAGS="-g -Ddisable_tests=1 -Ddisable_dbm=1 -Ddisable_libpkix=1 -Ddisable_ckbi=1 -Ddisable_fips=1 --opt --static$CROSS_FLAGS"
        {
          echo "LD_LIBRARY_PATH=$NSS_OUT/lib"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$NSS_OUT/lib"
          echo "NSS_DIR=$NSS_DIR"
          echo "NSS_PREBUILT=1"
          echo "NSS_BUILD_FLAGS=$FLAGS"
          echo "NSS_BUILD_CFLAGS=$CFLAGS_FOR_NSS"
        } >> "$GITHUB_ENV"
        # Also as outputs, so that Build below cannot pick up ambient values.
        {
          echo "build-flags=$FLAGS"
          echo "build-cflags=$CFLAGS_FOR_NSS"
        } >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" == "Windows" ]; then
          echo "$NSS_OUT/lib" >> "$GITHUB_PATH"
        fi

    - name: Set up Java (Android)
      if: ${{ contains(inputs.target, '-android') }}
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: zulu
        java-version: ${{ inputs.java-version }}

    - name: Set up Android SDK (Android)
      if: ${{ contains(inputs.target, '-android') }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        accept-android-sdk-licenses: true
        log-accepted-android-sdk-licenses: false
        packages: platform-tools

    - name: Set up Android NDK (Android)
      if: ${{ contains(inputs.target, '-android') }}
      shell: bash
      env:
        NDK_VERSION: ${{ steps.validate.outputs.ndk-version }}
      run: | # zizmor: ignore[github-env] The NDK has to reach build.sh and the caller's Rust build.
        sdkmanager --install "ndk;$NDK_VERSION"
        NDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/$NDK_VERSION"
        [ -d "$NDK" ] || { echo "::error::NDK $NDK_VERSION not found at $NDK"; exit 1; }
        # The runner image points these at its own default NDK. build.sh reads
        # ANDROID_NDK_ROOT and cargo-ndk reads ANDROID_NDK_HOME first, so set
        # both, for NSS and the caller's Rust code to build with the same NDK.
        {
          echo "NDK_VERSION=$NDK_VERSION"
          echo "ANDROID_NDK_ROOT=$NDK"
          echo "ANDROID_NDK_HOME=$NDK"
        } >> "$GITHUB_ENV"

    - name: Build
      shell: bash
      if: ${{ steps.check_build.outputs.build_nss && inputs.deps-only != 'true' }}
      env:
        NSS_BUILD_FLAGS: ${{ steps.setup_env.outputs.build-flags }}
        NSS_BUILD_CFLAGS: ${{ steps.setup_env.outputs.build-cflags }}
        TARGET_PLATFORM: ${{ inputs.target }}
      run: |
        [ -n "$NSS_BUILD_CFLAGS" ] && export CFLAGS="$NSS_BUILD_CFLAGS"
        case "$TARGET_PLATFORM" in
          *-android*)
            # Until an NSS release bundles NSPR 4.41, which builds with a current
            # NDK, skip the legacy toolchain setup in NSPR's configure the way
            # 4.41 does. This finds nothing to replace in NSPR 4.41 or later.
            sed -i'' 's/if test -z "$android_ndk" ; then/$as_echo "#define ANDROID 1" >>confdefs.h\n    ;;\nunreachable)\n    if test -z "$android_ndk" ; then/g' nspr/configure ;;
          *)
            # build.sh --target-os=android picks the compiler itself, so only
            # these builds can use sccache. For i686-*-linux-gnu,
            # gcc-multilib provides the 32-bit toolchain and headers.
            [ "$SCCACHE_CC" ] && [ "$SCCACHE_CXX" ] && export CC="$SCCACHE_CC" CXX="$SCCACHE_CXX" ;;
        esac
        # shellcheck disable=SC2086
        $NSS_DIR/build.sh $NSS_BUILD_FLAGS

    - name: Save NSS cache
      # Keep in sync with the same predicate in ../rust/action.yml.
      if: ${{ inputs.cache == 'true' && steps.check_build.outputs.build_nss && inputs.deps-only != 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: dist
        key: nss-${{ inputs.target || runner.os }}${{ steps.ubuntu_release.outputs.codename }}-${{ runner.arch }}-${{ steps.nss.outputs.version }}-${{ steps.nss.outputs.nspr-version }}${{ steps.validate.outputs.cache-suffix }}
