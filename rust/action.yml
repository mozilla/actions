name: Install Rust
description: Install Rust and tools
branding:
  icon: package
  color: orange

inputs:
  version:
    description: "Rust toolchain version to install"
    default: "stable"
  components:
    description: "Rust components to install"
    default: ""
  tools:
    description: "Additional Rust tools to install"
    default: ""
  token:
    description: "A Github PAT"
    required: false
  targets:
    description: Comma-separated list of target triples to install for this toolchain
    required: false
  workspaces:
    description: Newline-separated list of workspaces (not yet passed through to rust-cache)
    required: false
  rust-cache:
    description: Whether to enable Rust dependency caching via Swatinem/rust-cache
    default: "true"
  cache-key:
    description: Extra component for the Rust cache key, to separate jobs that would otherwise share one entry
    default: ""
  sccache:
    description: Whether to enable sccache for Rust compilation caching
    default: "false"
  make-default:
    description: Whether to make the installed toolchain the default
    default: "true"

outputs:
  cache-key:
    description: The rust-cache shared-key this invocation would use
    value: ${{ steps.cache-key.outputs.value }}
  cache-hit:
    description: Whether rust-cache restored an exact match (empty when caching is disabled)
    value: ${{ steps.rust-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up environment
      shell: bash
      run: |
        {
          echo "RUST_BACKTRACE=full"
          echo "CARGO_INCREMENTAL=0" # Incremental artifacts are useless on a CI runner.
        } >> "$GITHUB_ENV"

    - name: Install Rust
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        MAKE_DEFAULT: ${{ inputs.make-default }}
      run: |
        rustup toolchain install "$VERSION" --profile minimal
        # Trim whitespace, since composite expressions may yield spaces.
        COMPONENTS="$(echo "$COMPONENTS" | xargs)"
        TARGETS="$(echo "$TARGETS" | tr ',' ' ' | xargs)"
        if [ -n "$COMPONENTS" ]; then
          # shellcheck disable=SC2086
          rustup component add --toolchain "$VERSION" $COMPONENTS
        fi
        if [ -n "$TARGETS" ]; then
          for target in $TARGETS; do
            rustup target add --toolchain "$VERSION" "$target"
          done
        fi
        if [ "$MAKE_DEFAULT" = "true" ]; then rustup default "$VERSION"; fi

    - name: Use sccache
      # Prevent double-installation if the action is invoked multiple times in
      # the same workflow (e.g. when both rust and nss actions enable sccache).
      if: ${{ inputs.sccache == 'true' && env.SCCACHE_ENABLED != '1' }}
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Enable sccache
      if: ${{ inputs.sccache == 'true' }}
      shell: bash
      run: |
        {
          echo "SCCACHE_ENABLED=1"
          echo "RUSTC_WRAPPER=sccache"
          echo "SCCACHE_GHA_ENABLED=true"
        } >> "$GITHUB_ENV"

    - name: Compose Rust cache key
      id: cache-key
      shell: bash
      env:
        BASE: ${{ runner.os }}-${{ inputs.version }}
        EXTRA: ${{ inputs.cache-key }}
      run: echo "value=${BASE}${EXTRA:+-$EXTRA}" >> "$GITHUB_OUTPUT"

    # One entry per OS × toolchain; pass cache-key to split that further. Saves only on
    # the default branch: merge queue refs are deleted with the queue entry, and PR saves
    # (restorable only within that PR) churn the 10 GB LRU budget and evict the shared
    # entry. A workflow that never runs on the default branch therefore gets no caching.
    # Rolling `nightly` is skipped since it rotates daily; a pinned nightly caches normally.
    # Disabled automatically when sccache is active, since they serve the same purpose.
    - name: Enable Rust cache
      id: rust-cache
      if: ${{ inputs.rust-cache == 'true' && inputs.sccache != 'true' && inputs.version != 'nightly' }}
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        cache-bin: false # Binaries are installed via binstall and don't benefit from caching
        cache-all-crates: false
        # TODO: pass workspaces input once we understand the interaction with empty values
        shared-key: ${{ steps.cache-key.outputs.value }}
        # Keep in sync with the same predicate in ../nss/action.yml.
        save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Set up MSVC (Windows)
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@v1 # zizmor: ignore[unpinned-uses]
      # TODO: Would like to pin this, but the Mozilla org allowlist requires "ilammy/msvc-dev-cmd@v1*"
      # uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

    # See https://github.com/ilammy/msvc-dev-cmd#name-conflicts-with-shell-bash
    - name: Set up build environment (Windows)
      shell: bash
      if: ${{ runner.os == 'Windows' }}
      run: rm /usr/bin/link.exe || true

    # Use cargo-binstall for faster tool installation via pre-built binaries,
    # with fallback to cargo install.
    - name: Install Rust tools
      shell: bash
      if: ${{ inputs.tools != '' }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        TOOLS: ${{ inputs.tools }}
      run: |
        # renovate: depName=cargo-bins/cargo-binstall datasource=github-tags
        BINSTALL_VERSION=1.21.1
        BINSTALL_SHA=e00d2c94cc0067b77737821097a62d91c0301baa
        curl -L --proto '=https' --tlsv1.2 -sSf \
          "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/${BINSTALL_SHA}/install-from-binstall-release.sh" \
          | BINSTALL_VERSION="$BINSTALL_VERSION" bash

        for tool in $(echo $TOOLS | tr "," " "); do
          cargo binstall --no-confirm "$tool" || cargo install --locked "$tool"
        done
