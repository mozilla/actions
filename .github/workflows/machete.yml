name: Machete
on: # zizmor: ignore[concurrency-limits] - concurrency is the caller's responsibility
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machete:
    name: Check for unused dependencies
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/rust
        with:
          tools: cargo-hack,cargo-machete
          token: ${{ github.token }}

      - name: Check for unused dependencies
        run: |
          # --with-metadata has false positives, see https://github.com/bnjbvr/cargo-machete/issues/127
          cargo machete --with-metadata
          cargo hack --workspace --no-manifest-path machete --with-metadata
