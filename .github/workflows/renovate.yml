name: Renovate
on:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {} # PAT carries all required permissions; GITHUB_TOKEN is unused
    steps:
      - name: Run Renovate
        run: docker run --rm -e RENOVATE_TOKEN "$RENOVATE_IMAGE" mozilla/actions
        env:
          # renovate: depName=renovate/renovate datasource=docker
          RENOVATE_IMAGE: renovate/renovate:44.199.2@sha256:0538f498be1b074e2434f8449cab7b2be30f8c0d0baf3b72814010f19db5bcfb
          RENOVATE_TOKEN: ${{ secrets.RENOVATE }} # zizmor: ignore[secrets-outside-env]
