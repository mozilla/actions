name: Test Actions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NSS_TEST_VERSION: "3.126"
  NSS_TEST_SHA256: "c95a4cf93d6939000642254422d71dffccb5c017d0f40733d3e2be18aa93f1be"
  ROUNDTRIP_CACHE_KEY: roundtrip-${{ github.run_id }}

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    uses: ./.github/workflows/actionlint.yml
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml

  test-rust:
    name: Test Rust action
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./rust
        id: rust
        with:
          version: stable
          tools: cargo-nextest
          token: ${{ github.token }}
          rust-cache: false

      - name: Verify installation
        env:
          GOT: ${{ steps.rust.outputs.cache-key }}
        run: |
          [ "$GOT" = "${ImageOS}-stable" ] || { echo "::error::cache-key is '$GOT', want '${ImageOS}-stable'"; exit 1; }
          cargo --version
          rustc --version
          cargo nextest --version

  # test-rust passes rust-cache: false, so nothing else exercises the caching path.
  test-rust-cache:
    name: Test Rust action caching (${{ matrix.os }}, cache-key=${{ matrix.cache-key || 'unset' }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cache-key: ""
            want: ubuntu24-stable
          - os: ubuntu-24.04
            cache-key: release
            want: ubuntu24-stable-release
          # A second image of the same OS, which used to share an entry with the first.
          - os: ubuntu-22.04
            cache-key: ""
            want: ubuntu22-stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./rust
        with:
          version: stable
          token: ${{ github.token }}
          cache-key: ${{ matrix.cache-key }}

      - name: Verify cache key and build environment
        env:
          GOT: ${{ steps.rust.outputs.cache-key }}
          WANT: ${{ matrix.want }}
        run: |
          [ "$GOT" = "$WANT" ] || { echo "::error::cache-key is '$GOT', want '$WANT'"; exit 1; }
          [ "$CARGO_INCREMENTAL" = "0" ] || { echo "::error::CARGO_INCREMENTAL is '${CARGO_INCREMENTAL:-unset}', want 0"; exit 1; }

  # Self-hosted runners don't set ImageOS, so check the fallback that covers them.
  # rust-cache is off because only the composed key matters here, and a key that no
  # hosted runner produces shouldn't take up a cache entry.
  test-rust-cache-no-imageos:
    name: Test Rust action caching (no ImageOS)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    env:
      ImageOS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./rust
        with:
          version: stable
          token: ${{ github.token }}
          rust-cache: false

      - name: Verify the cache key falls back to the runner OS
        env:
          GOT: ${{ steps.rust.outputs.cache-key }}
        run: |
          [ "$GOT" = "Linux-stable" ] || { echo "::error::cache-key is '$GOT', want 'Linux-stable'"; exit 1; }

  # Saving only happens on the default branch, so the round trip can only be
  # exercised there: this job populates the cache, test-rust-cache-restore reads it.
  test-rust-cache-save:
    name: Populate Rust cache
    timeout-minutes: 15
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./rust
        with:
          version: stable
          token: ${{ github.token }}
          cache-key: ${{ env.ROUNDTRIP_CACHE_KEY }}

      - run: cargo build --locked --all-features
        working-directory: test-crate

  test-rust-cache-restore:
    name: Restore Rust cache
    timeout-minutes: 15
    needs: test-rust-cache-save
    permissions:
      contents: read
      actions: write # Required to delete the throwaway cache entry below
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rust
        uses: ./rust
        with:
          version: stable
          token: ${{ github.token }}
          cache-key: ${{ env.ROUNDTRIP_CACHE_KEY }}

      - name: Verify the cache was restored
        env:
          HIT: ${{ steps.rust.outputs.cache-hit }}
        run: |
          [ "$HIT" = "true" ] || { echo "::error::cache-hit is '${HIT:-empty}', want true"; exit 1; }

      # actions/cache has no delete action, so use the API.
      - name: Remove the throwaway cache entry
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: v0-rust-${{ steps.rust.outputs.cache-key }}
        run: |
          ids=$(gh cache list --key "$PREFIX" --json id --jq '.[].id')
          for id in $ids; do gh cache delete "$id"; done
          n=$(printf '%s' "$ids" | grep -c . || true)
          [ "$n" -eq 1 ] || { echo "::error::matched $n entries for $PREFIX, want 1"; exit 1; }

  test-toolchains:
    name: Test toolchains action
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    # cargo is pre-installed on GitHub-hosted Ubuntu runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./toolchains
        id: toolchains
        with:
          working-directory: test-crate

      - name: Verify output
        env:
          TOOLCHAINS: ${{ steps.toolchains.outputs.toolchains }}
        run: |
          echo "Toolchains: $TOOLCHAINS"
          python3 -c "
          import os, json
          data = json.loads(os.environ['TOOLCHAINS'])
          assert len(data) == 3, f'Expected 3 toolchains, got {data}'
          assert '1.70.0' in data, f'Expected MSRV 1.70.0 in {data}'
          assert 'stable' in data, f'Expected stable in {data}'
          assert 'nightly' in data, f'Expected nightly in {data}'
          print('OK:', data)
          "

  test-nss:
    name: Test NSS action
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./nss
        with:
          minimum-version: ${{ env.NSS_TEST_VERSION }}
          sha256: ${{ env.NSS_TEST_SHA256 }}
          cache: false

      - name: Verify NSS is available
        run: |
          if [ -n "$NSS_DIR" ]; then
            echo "NSS_DIR=$NSS_DIR (built from source)"
          else
            pkg-config --modversion nss
            echo "Using system NSS: $(pkg-config --modversion nss)"
          fi

  clippy:
    uses: ./.github/workflows/clippy.yml

  rustfmt:
    uses: ./.github/workflows/rustfmt.yml

  deny:
    uses: ./.github/workflows/deny.yml

  machete:
    uses: ./.github/workflows/machete.yml

  sanitize:
    uses: ./.github/workflows/sanitize.yml

  crap:
    uses: ./.github/workflows/crap.yml
    permissions:
      contents: read
      security-events: write # Required to upload SARIF results to GitHub
    with:
      features: hashing,encoding

  mutants:
    uses: ./.github/workflows/mutants.yml
    with:
      shards: 1
      args: "--features hashing,encoding"

  test-nss-android:
    name: Test NSS action (Android)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - arm-linux-androideabi
          - x86_64-linux-android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 23

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - uses: ./nss
        with:
          minimum-version: ${{ env.NSS_TEST_VERSION }}
          sha256: ${{ env.NSS_TEST_SHA256 }}
          target: ${{ matrix.target }}
          token: ${{ github.token }}
          cache: false

      - name: Verify NSS is available for Android
        run: |
          echo "NSS_DIR=$NSS_DIR"
          ls dist/Release/lib/*.a
