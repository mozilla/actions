name: Claude Code Review
description: Runs Claude Code Review on a pull request.
branding:
  icon: eye
  color: purple

inputs:
  anthropic_api_key:
    description: Anthropic API key.
    required: true
  model:
    description: >
      Claude model to use for the review. Defaults to whatever
      anthropics/claude-code-action uses.
    default: ""
  fallback_model:
    description: >
      Fallback Claude model if the primary model is unavailable. Defaults to
      whatever anthropics/claude-code-action uses.
    default: ""
  budget:
    description: Maximum budget in USD for the review.
    default: "10.00"
  prompt:
    description: >
      Additional project-specific review instructions, appended after the base
      review prompt. Use this to add domain-specific focus areas (e.g., protocol
      compliance, unsafe FFI rules) relevant to your project.
    default: ""
  web_domains:
    description: >
      Hosts Claude may fetch with WebFetch, one per line. Replaces the default
      list rather than adding to it; set it to the empty string for no web
      access. Rules match the hostname only, so a host that also serves
      user-uploaded content exposes that content too.
    default: |
      www.rfc-editor.org
      www.ietf.org
      datatracker.ietf.org
      dom.spec.whatwg.org
      encoding.spec.whatwg.org
      fetch.spec.whatwg.org
      html.spec.whatwg.org
      url.spec.whatwg.org
      www.w3.org
      tc39.es
      www.unicode.org
      csrc.nist.gov
      nvlpubs.nist.gov
      doc.rust-lang.org
      rust-lang.github.io
      code.claude.com
      docs.claude.com
      docs.github.com
      docs.rs
      crates.io
      man7.org
      pubs.opengroup.org
      clang.llvm.org
      searchfox.org
      firefox-source-docs.mozilla.org
      hg.mozilla.org
      treeherder.mozilla.org
      bugzilla.mozilla.org
      www.cve.org
      nvd.nist.gov
      rustsec.org
      osv.dev

runs:
  using: composite
  steps:
    - name: Read prompt
      id: prompt
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXTRA_PROMPT: ${{ inputs.prompt }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        HISTORY: ${{ runner.temp }}/review-history.json
      run: |
        if [[ "$HEAD_REPO" != "$REPOSITORY" ]]; then
          echo "::notice::Not reviewing: only pull requests from a branch in $REPOSITORY are reviewed, on pull request events."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        DELIM="EOF_$(head -c 8 /dev/urandom | xxd -p)"
        {
          echo "content<<$DELIM"
          echo "You are reviewing pull request #${PR_NUMBER} in repository ${REPOSITORY}."
          echo "This pull request's review history was fetched to ${HISTORY}; step 2 below means that file."
          echo ""
          cat "$ACTION_PATH/prompt.md"
          if [[ -n "$EXTRA_PROMPT" ]]; then
            echo ""
            echo "## Additional Project-Specific Review Guidelines"
            echo ""
            echo "$EXTRA_PROMPT"
          fi
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

    - name: Build web allowlist
      id: web
      shell: bash
      env:
        DOMAINS: ${{ inputs.web_domains }}
      run: |
        ARGS=""
        while read -r D; do
          [[ -z "$D" ]] && continue
          # Rules match hostnames; a path or scheme here would silently never match.
          if [[ ! "$D" =~ ^[A-Za-z0-9.*-]+$ || "$D" == "*" ]]; then
            echo "::error::Not a hostname pattern: '$D'. Use a bare host."
            exit 1
          fi
          ARGS+=" \"WebFetch(domain:$D)\""
        done <<< "$DOMAINS"
        if [[ -n "$ARGS" ]]; then
          echo "args=--allowedTools$ARGS" >> "$GITHUB_OUTPUT"
        else
          echo "No web domains allowed; Claude will have no WebFetch access."
          echo "args=" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout PR head
      if: ${{ steps.prompt.outputs.skip != 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    - name: Fetch sanitizer
      if: ${{ steps.prompt.outputs.skip != 'true' }}
      shell: bash
      env:
        SANITIZER: ${{ runner.temp }}/sanitizer.ts
      run: |
        if ! node --experimental-strip-types -e '' 2>/dev/null; then
          echo "::error::The sanitizer needs Node.js 22.6 or later; found $(node --version 2>/dev/null || echo none)."
          exit 1
        fi
        # renovate: depName=anthropics/claude-code-action datasource=github-tags
        SANITIZER_SHA=1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        curl -fsSL -o "$SANITIZER" \
          "https://raw.githubusercontent.com/anthropics/claude-code-action/$SANITIZER_SHA/src/github/utils/sanitizer.ts"

    # Fixed queries here can't be steered by injected review text.
    - name: Fetch review history
      if: ${{ steps.prompt.outputs.skip != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        SANITIZER: ${{ runner.temp }}/sanitizer.ts
        OUT: ${{ runner.temp }}/review-history.json
      run: |
        PR="repos/$REPOSITORY/pulls/$PR_NUMBER"
        REVIEWS="$RUNNER_TEMP/reviews.json" THREADS="$RUNNER_TEMP/threads.json"
        # Not the same as a pull request with no history.
        fail() {
          echo "::warning::Could not read the review history ($1), so no point is treated as settled."
          jq -n --arg reason "$1" '{unavailable: $reason}' > "$OUT"
          exit 0
        }
        EXPECTED=$(gh api "$PR" --jq .review_comments) || fail "pull request"
        gh api --paginate --jq '.[]' "$PR/reviews?per_page=100" | jq -s '.' > "$REVIEWS" || fail "reviews"
        # Resolution state is GraphQL-only.
        gh api graphql --paginate -F owner="${REPOSITORY%/*}" -F repo="${REPOSITORY#*/}" -F pr="$PR_NUMBER" \
          --jq '.data.repository.pullRequest.reviewThreads.nodes[]' -f query='
          query($owner: String!, $repo: String!, $pr: Int!, $endCursor: String) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                reviewThreads(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    isOutdated
                    path
                    line
                    originalLine
                    comments(first: 100) { nodes { author { login } body } }
                  }
                }
              }
            }
          }' | jq -s '.' > "$THREADS" || fail "review threads"
        # Short pages, or threads past the nested page, would otherwise pass as complete.
        GOT=$(jq '[.[].comments.nodes | length] | add // 0' "$THREADS")
        if [[ "$GOT" -lt "$EXPECTED" ]]; then
          fail "only $GOT of $EXPECTED review comments"
        fi
        # JSON, so a comment body cannot forge thread state.
        jq --slurpfile r "$REVIEWS" '{
          threads: [.[] | {path, line: (.line // .originalLine), resolved: .isResolved, outdated: .isOutdated,
            comments: [.comments.nodes[] | {author: (.author.login // "ghost"), body}]}],
          reviews: [$r[0][] | select((.body // "") != "") | {author: (.user.login // "ghost"), state, body}]}
          ' "$THREADS" > "$RUNNER_TEMP/history-raw.json" || fail "assembly"
        # Upstream sanitizes only context it builds; sanitize each body separately.
        node --experimental-strip-types --no-warnings --input-type=module -e '
          import { readFileSync } from "node:fs";
          const { sanitizeContent } = await import(process.argv[1]);
          const h = JSON.parse(readFileSync(0, "utf8"));
          for (const c of [...h.threads.flatMap((t) => t.comments), ...h.reviews]) c.body = sanitizeContent(c.body);
          process.stdout.write(JSON.stringify(h, null, 1));
          ' "$SANITIZER" < "$RUNNER_TEMP/history-raw.json" > "$OUT" || fail "sanitizing"
        echo "Review history: $(jq length "$THREADS") thread(s), $(jq length "$REVIEWS") review(s)."

    - name: Run Claude Code Review
      id: claude
      if: ${{ steps.prompt.outputs.skip != 'true' }}
      # The action throws on a budget cap; implicit success() would skip the next step.
      continue-on-error: true
      # TODO: Would like to pin this, but the Mozilla org allowlist requires "anthropics/claude-code-action@v1"
      uses: anthropics/claude-code-action@v1 # zizmor: ignore[unpinned-uses]
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ github.token }}
        # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
        # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options.
        # Agent/Task: the skill fans out. ReportFindings: it reports through that.
        # No MCP tools or Write/Edit: Claude reads through gh and returns structured output.
        # Bash output over about 30,000 characters is saved under ~/.claude/projects.
        # A system prompt too: skill subagents never see prompt.md.
        # Path rules need the extra leading slash: a single one anchors at the workspace,
        # `//` is the filesystem root. Workspace reads are allowed anyway.
        claude_args: |
          ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          ${{ inputs.fallback_model && format('--fallback-model {0}', inputs.fallback_model) || '' }}
          --max-budget-usd ${{ inputs.budget }}
          --append-system-prompt "Get the pull request's diff with gh pr diff and the pull request number. Output over about 30,000 characters is saved to a file; read all of it, finishing with offset and limit. The head commit is checked out at ${{ github.workspace }}; read surrounding code there with Read, Glob and Grep. Run each shell command alone, without pipes, && or ;: one unpermitted part denies the whole command. Read files with Read."
          --json-schema '{
            "type": "object", "additionalProperties": false, "required": ["body", "comments"],
            "properties": {
              "body": {"type": "string"},
              "diff_unavailable": {"type": "boolean"},
              "comments": {"type": "array", "items": {
                "type": "object", "additionalProperties": false, "required": ["path", "line", "body"],
                "properties": {
                  "path": {"type": "string"},
                  "line": {"type": "integer", "minimum": 1},
                  "side": {"enum": ["LEFT", "RIGHT"]},
                  "start_line": {"type": "integer", "minimum": 1},
                  "start_side": {"enum": ["LEFT", "RIGHT"]},
                  "body": {"type": "string"}}}}}}'
          --allowedTools Skill Agent Task ReportFindings
          --allowedTools "Bash(gh pr diff:*)" "Bash(gh pr view:*)" "Bash(gh issue view:*)"
          --allowedTools "Bash(gh release list:*)" "Bash(gh release view:*)"
          --allowedTools "Read(/${{ runner.temp }}/review-history.json)" "Read(~/.claude/projects/**)"
          ${{ steps.web.outputs.args }}
        prompt: ${{ steps.prompt.outputs.content }}

    # Event is a literal here. Runs after failure so a partial review still posts.
    - name: Post review
      if: ${{ !cancelled() && steps.claude.outcome != 'skipped' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        OUTCOME: ${{ steps.claude.outcome }}
        LOG: ${{ runner.temp }}/claude-execution-output.json
        # Unset unless Claude succeeded with output matching the schema.
        STRUCTURED: ${{ steps.claude.outputs.structured_output }}
        BUDGET: ${{ inputs.budget }}
        SANITIZER: ${{ runner.temp }}/sanitizer.ts
      run: |
        PR="repos/$REPOSITORY/pulls/$PR_NUMBER"
        if [[ -n "$STRUCTURED" ]]; then
          STRUCTURED=$(node --experimental-strip-types --no-warnings --input-type=module -e '
            const { redactSecrets } = await import(process.argv[1]);
            process.stdout.write(redactSecrets(process.env.STRUCTURED));
            ' "$SANITIZER")
        fi
        RESULT=$(jq 'map(select(.type == "result")) | last // {}' "$LOG" 2>/dev/null || echo '{}')
        eval "$(jq -r '@sh "COST=\(.total_cost_usd // "?") TURNS=\(.num_turns // "?")
          SECS=\(if .duration_ms then .duration_ms / 1000 | round else "?" end)
          SUBTYPE=\(.subtype // "") DENIALS=\(.permission_denials // [] | length)"' <<< "$RESULT")"
        # Prefix match: the budget subtype is undocumented.
        if [[ "$SUBTYPE" == error_max_budget* ]]; then
          echo "::warning::Claude stopped at the \$$BUDGET budget cap before returning a review. Raise the 'budget' input."
        fi
        if [[ "$DENIALS" -gt 0 ]]; then
          echo "::warning::Claude had $DENIALS permission denial(s), so the review may be incomplete."
          echo "::group::Permission denials"
          jq -r '.permission_denials[] | "  \(.tool_name): \(.tool_input.command // (.tool_input | tojson) | gsub("\n"; "\\n"))"' <<< "$RESULT"
          echo "::endgroup::"
        fi
        # Names only: the action hides Claude's output, so this is the record of what it did.
        echo "::group::Tool calls"
        jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name' \
          "$LOG" 2>/dev/null | sort | uniq -c | sort -rn || true
        echo "::endgroup::"
        NOTE=""
        if [[ -z "$STRUCTURED" ]]; then
          echo "::warning::Claude returned no review."
          NOTE="> [!WARNING]"$'\n'"> Claude returned no review (Claude step: \`$OUTCOME\`)."
        elif [[ "$OUTCOME" != "success" ]]; then
          NOTE="> [!WARNING]"$'\n'"> Review did not finish (\`$OUTCOME\`); it may be incomplete."
        fi
        # Every run posts a review; only a returned, empty review claims no findings.
        build() {
          jq -n --arg sha "$HEAD_SHA" --arg note "$NOTE" --argjson fold "$1" '
            (env.STRUCTURED | if . == "" then null else fromjson end) as $r
            | ($r.comments // [] | map({path, line, side: (.side // "RIGHT"), body}
              + (if .start_line then {start_line, start_side: (.start_side // .side // "RIGHT")} else {} end))) as $c
            | (if $fold then [$c[] | "**\(.path):\(if .start_line then "\(.start_line)-" else "" end)\(.line)**\n\n\(.body)"]
               else [] end) as $folded
            | {commit_id: $sha, event: "COMMENT", comments: (if $fold then [] else $c end),
               body: ([if $r == null or $r.body != "" then $r.body // ""
                       elif ($c | length) == 0 then "_No findings._"
                       elif $fold then ""
                       else "_No whole-change observations._" end] + $folded + [$note]
                 | map(select(. != "")) | join("\n\n"))}'
        }
        PAYLOAD=$(build false)
        POSTED=$(jq '.comments | length' <<< "$PAYLOAD")
        for ID in $(gh api --paginate "$PR/reviews?per_page=100" --jq '.[] | select(.state == "PENDING") | .id'); do
          gh api --method DELETE "$PR/reviews/$ID" > /dev/null || true
        done
        if ! URL=$(gh api --method POST "$PR/reviews" --input - --jq .html_url <<< "$PAYLOAD" 2>&1); then
          # Typically a 422 for an anchor outside the diff.
          echo "::warning::GitHub rejected the review (${URL//$'\n'/ }), so its inline comments are posted in the body."
          POSTED=0
          URL=$(build true | gh api --method POST "$PR/reviews" --input - --jq .html_url) || {
            echo "::error::Could not post a review on $PR."
            exit 1
          }
        fi
        echo "Posted a review with $POSTED inline comment(s): $URL"
        {
          echo "### Claude review"
          echo ""
          echo "- Claude step: \`$OUTCOME\`${SUBTYPE:+ (\`$SUBTYPE\`)}"
          echo "- Review posted: $URL ($POSTED inline comments)"
          echo "- $TURNS turns, ${SECS}s, \$$COST of \$$BUDGET"
        } >> "$GITHUB_STEP_SUMMARY"
        if jq -ne 'env.STRUCTURED | fromjson? | .diff_unavailable == true' >/dev/null; then
          echo "::error::The pull request diff was unavailable, so the change was not reviewed."
          exit 1
        fi
        # The conclusion output is unset when the action throws.
        # A budget cap is expected.
        if [[ "$OUTCOME" == "failure" && "$SUBTYPE" != error_max_budget* ]]; then
          echo "Claude execution failed." >&2
          exit 1
        fi
