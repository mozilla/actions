name: Claude Code Review
description: Runs Claude Code Review on a pull request.
branding:
  icon: eye
  color: purple

inputs:
  anthropic_api_key:
    description: Anthropic API key.
    required: true
  model:
    description: >
      Claude model to use for the review. Defaults to whatever
      anthropics/claude-code-action uses.
    default: ""
  fallback_model:
    description: >
      Fallback Claude model if the primary model is unavailable. Defaults to
      whatever anthropics/claude-code-action uses.
    default: ""
  budget:
    description: Maximum budget in USD for the review.
    default: "10.00"
  prompt:
    description: >
      Additional project-specific review instructions, appended after the base
      review prompt. Use this to add domain-specific focus areas (e.g., protocol
      compliance, unsafe FFI rules) relevant to your project.
    default: ""
  web_domains:
    description: >
      Hosts Claude may fetch with WebFetch, one per line. Replaces the default
      list rather than adding to it; set it to the empty string for no web
      access. Rules match the hostname only, so a host that also serves
      user-uploaded content exposes that content too.
    default: |
      www.rfc-editor.org
      www.ietf.org
      datatracker.ietf.org
      dom.spec.whatwg.org
      encoding.spec.whatwg.org
      fetch.spec.whatwg.org
      html.spec.whatwg.org
      url.spec.whatwg.org
      www.w3.org
      tc39.es
      www.unicode.org
      csrc.nist.gov
      nvlpubs.nist.gov
      doc.rust-lang.org
      rust-lang.github.io
      code.claude.com
      docs.claude.com
      docs.github.com
      docs.rs
      crates.io
      man7.org
      pubs.opengroup.org
      clang.llvm.org
      searchfox.org
      firefox-source-docs.mozilla.org
      hg.mozilla.org
      treeherder.mozilla.org
      bugzilla.mozilla.org
      www.cve.org
      nvd.nist.gov
      rustsec.org
      osv.dev

runs:
  using: composite
  steps:
    # workflow_run carries no pull request number for forks, so match its head instead.
    - name: Find pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        ON_PR: ${{ github.event.issue.pull_request && 'true' || '' }}
        RUN_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        skip() {
          echo "::notice::Not reviewing: $*"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        }
        case "$EVENT" in
        pull_request_target) MODE=auto ;;
        issue_comment)
          [[ -n "$ON_PR" ]] || skip "the comment is not on a pull request."
          MODE=comment
          ;;
        workflow_run)
          MODE=auto
          PR_NUMBER=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f head="$RUN_OWNER:$RUN_BRANCH" |
            jq -r --arg sha "$RUN_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '[.[] | select(.head.sha == $sha and .base.repo.full_name == $repo) | .number | tostring] | join(" ")')
          [[ -n "$PR_NUMBER" ]] || skip "no open pull request from $RUN_OWNER:$RUN_BRANCH is at $RUN_SHA."
          # The trigger workflow comes from the pull request, so nothing in its run can disambiguate.
          [[ "$PR_NUMBER" != *" "* ]] || skip "pull requests $PR_NUMBER share $RUN_OWNER:$RUN_BRANCH at $RUN_SHA."
          ;;
        *)
          echo "::error::Claude Code Review must run on a workflow_run, issue_comment or pull_request_target event."
          exit 1
          ;;
        esac
        PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
        [[ "$(jq -r .state <<< "$PR")" == open ]] || skip "pull request #$PR_NUMBER is not open."
        [[ "$(jq -r .user.type <<< "$PR")" != Bot ]] || skip "pull request #$PR_NUMBER is by a bot."
        [[ "$(jq -r .head.repo.full_name <<< "$PR")" != null ]] || skip "the head repository of #$PR_NUMBER is gone."
        if [[ "$MODE" == auto ]]; then
          [[ "$(jq -r .draft <<< "$PR")" != true ]] || skip "pull request #$PR_NUMBER is a draft."
          # A newer push brings its own run.
          if [[ "$EVENT" == workflow_run && "$(jq -r .head.sha <<< "$PR")" != "$RUN_SHA" ]]; then
            skip "pull request #$PR_NUMBER moved past $RUN_SHA."
          fi
        fi
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        # Git refnames and logins cannot hold newlines.
        jq -r '"number=\(.number)", "author=\(.user.login)", "head_repo=\(.head.repo.full_name)",
          "head_ref=\(.head.ref)", "head_sha=\(.head.sha)", "base_sha=\(.base.sha)"' \
          <<< "$PR" >> "$GITHUB_OUTPUT"

    # Read prompt before PR checkout so it comes from the action version (non-spoofable).
    - name: Read prompt
      id: prompt
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EXTRA_PROMPT: ${{ inputs.prompt }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REPOSITORY: ${{ github.repository }}
        INDEX: ${{ runner.temp }}/review-history/index.json
        DIFF_INDEX: ${{ runner.temp }}/pr-diff/index.json
      run: |
        # Use a random delimiter to prevent injection via the prompt input.
        DELIM="EOF_$(head -c 8 /dev/urandom | xxd -p)"
        {
          echo "content<<$DELIM"
          # Explicitly anchor Claude to the correct PR so concurrent workflow runs
          # for different PRs cannot cross-contaminate each other's reviews.
          echo "You are reviewing pull request #${PR_NUMBER} in repository ${REPOSITORY}."
          echo "IMPORTANT: Post all review comments exclusively to pull request #${PR_NUMBER}."
          echo "You may read other pull requests for context, but do not post comments to them."
          echo "The workspace's Claude configuration was replaced with the base branch's, so do not use git diff for the changes under review."
          echo "This pull request's complete review history was fetched to ${INDEX}; step 2 below means that file."
          echo "This pull request's diff was fetched to ${DIFF_INDEX}; step 3 below means that file."
          echo ""
          cat "$ACTION_PATH/prompt.md"
          if [[ -n "$EXTRA_PROMPT" ]]; then
            echo ""
            echo "## Additional Project-Specific Review Guidelines"
            echo ""
            echo "$EXTRA_PROMPT"
          fi
          echo "$DELIM"
        } >> "$GITHUB_OUTPUT"

    # Before checkout too, so the pull request cannot widen its own allowlist.
    - name: Build web allowlist
      id: web
      shell: bash
      env:
        DOMAINS: ${{ inputs.web_domains }}
      run: |
        ARGS=""
        while read -r D; do
          [[ -z "$D" ]] && continue
          # Rules match hostnames; a path or scheme here would silently never match.
          if [[ ! "$D" =~ ^[A-Za-z0-9.*-]+$ || "$D" == "*" ]]; then
            echo "::error::Not a hostname pattern: '$D'. Use a bare host."
            exit 1
          fi
          ARGS+=" \"WebFetch(domain:$D)\""
        done <<< "$DOMAINS"
        if [[ -n "$ARGS" ]]; then
          echo "args=--allowedTools$ARGS" >> "$GITHUB_OUTPUT"
        else
          echo "No web domains allowed; Claude will have no WebFetch access."
          echo "args=" >> "$GITHUB_OUTPUT"
        fi

    # Authors who can push are reviewed on every push; anyone else's pull request
    # once per comment from someone who can.
    - name: Check that the review is trusted
      id: trust
      if: ${{ steps.pr.outputs.skip != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MODE: ${{ steps.pr.outputs.mode }}
        AUTHOR: ${{ steps.pr.outputs.author }}
        HEAD_REPO: ${{ steps.pr.outputs.head_repo }}
        HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        COMMENTER: ${{ github.event.comment.user.login }}
        COMMENTED_AT: ${{ github.event.comment.created_at }}
      run: |
        untrusted() {
          echo "::notice::Not reviewing: $*"
          echo "trusted=false" >> "$GITHUB_OUTPUT"
          exit 0
        }
        can_push() {
          local perm
          if ! perm="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" \
            --jq .permission 2>"$RUNNER_TEMP/gh-err")"; then
            echo "::error::Can't read the permission of $1 on $GITHUB_REPOSITORY:" \
              "$(cat "$RUNNER_TEMP/gh-err")"
            exit 1
          fi
          [[ "$perm" == admin || "$perm" == write ]]
        }
        AUTHOR_CAN_PUSH=false
        if [[ "$HEAD_REPO" == "$GITHUB_REPOSITORY" ]] || can_push "$AUTHOR"; then
          AUTHOR_CAN_PUSH=true
        fi
        if [[ "$MODE" == auto ]]; then
          [[ "$AUTHOR_CAN_PUSH" == true ]] ||
            untrusted "$AUTHOR cannot push here; someone who can may comment /claude-review."
        else
          [[ "$AUTHOR_CAN_PUSH" == false ]] || untrusted "$AUTHOR's pull requests are reviewed on every push."
          can_push "$COMMENTER" || untrusted "$COMMENTER cannot push here."
          # GitHub stamps the trigger workflow's run for every push; commit dates are forgeable.
          SEEN=$(gh api --paginate -X GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/claude-review-trigger.yml/runs" \
            -f event=pull_request -f branch="$HEAD_REF" -f created="<$COMMENTED_AT" \
            --jq '.workflow_runs[] | {created_at, head_sha, repo: .head_repository.full_name}' |
            jq -rs --arg repo "$HEAD_REPO" --arg at "$COMMENTED_AT" \
              '[.[] | select(.repo == $repo and .created_at < $at)] | max_by(.created_at) | .head_sha // empty')
          [[ -n "$SEEN" ]] || untrusted "no push to the pull request predates $COMMENTER's comment, or it has a merge conflict."
          [[ "$SEEN" == "$HEAD_SHA" ]] ||
            untrusted "the pull request changed after $COMMENTER's comment, or has a merge conflict; resolve it and comment again to review $HEAD_SHA."
        fi
        echo "trusted=true" >> "$GITHUB_OUTPUT"

    # Pinned to the trusted SHA, so a later push cannot swap what is reviewed.
    - name: Checkout PR head
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.pr.outputs.head_repo }}
        ref: ${{ steps.pr.outputs.head_sha }}
        persist-credentials: false
        # Trust is checked above. Risks: https://gh.io/securely-using-pull_request_target
        allow-unsafe-pr-checkout: true

    - name: Take Claude's configuration from the base branch
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      shell: bash
      env:
        BASE_REPO: ${{ github.repository }}
        BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        FETCH_TOKEN: ${{ github.token }}
      run: |
        # Write credentials into the local git config rather than the command line
        # to avoid exposure in process listings. Unset on exit so the token isn't
        # left in .git/config if the fetch fails.
        AUTH_HEADER="$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')"
        git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic $AUTH_HEADER"
        trap 'git config --local --unset "http.https://github.com/.extraheader" 2>/dev/null || true' EXIT
        git fetch --depth=1 --no-recurse-submodules "https://github.com/$BASE_REPO" "$BASE_SHA"
        rm -rf -- .github/copilot-instructions.md .mcp.json .claude.json .ripgreprc .gitmodules .husky
        if git cat-file -e "FETCH_HEAD:.github/copilot-instructions.md" 2>/dev/null; then
          git checkout FETCH_HEAD -- .github/copilot-instructions.md
        fi
        # Prune for security
        find . -name .git -prune -o -name .claude -prune -print0 | xargs -0r rm -rf --
        find . -name .git -prune -o \
          \( -name AGENTS.md -o -name CLAUDE.md -o -name CLAUDE.local.md \) -prune -print0 |
          xargs -0r rm -rf --
        # Restoring a pathspec the base branch doesn't have fails, so check first.
        TREE="$(git ls-tree -r --name-only FETCH_HEAD)"
        if grep -q -e '^\.claude/' -e '/\.claude/' <<<"$TREE"; then
          git checkout FETCH_HEAD -- ':(glob)**/.claude/**'
        fi

    # Fixed queries here can't be steered by injected review text.
    - name: Fetch review history
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REPOSITORY: ${{ github.repository }}
        WORK: ${{ runner.temp }}/review-history-work
        DIR: ${{ runner.temp }}/review-history
        PER: 20 # Comments per shard. Small enough that no single Read can truncate.
      run: |
        PR="repos/$REPOSITORY/pulls/$PR_NUMBER"
        mkdir -p "$WORK" "$DIR"
        RAW="$WORK/comments.ndjson" REVIEWS="$WORK/reviews.json" THREADS="$WORK/threads.json"
        # Also to the run summary; log warnings go unread on a green job.
        warn() { echo "::warning::$*"; echo "- :warning: $*" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
        # Not the same as a pull request with no history.
        fail() {
          warn "Could not read the review history ($1), so no point is treated as settled."
          jq -n --arg reason "$1" '{error: $reason}' > "$DIR/index.json"
          exit 0
        }
        stream() { gh api --paginate --jq '.[]' "$1?per_page=100"; }
        # After this, any pending review is ours.
        STALE=$(stream "$PR/reviews" 2>/dev/null | jq -r 'select(.state == "PENDING") | .id' | tail -n1 || echo "")
        if [[ -n "$STALE" ]]; then
          echo "Deleting pending review $STALE left by an earlier run."
          gh api --method DELETE "$PR/reviews/$STALE" >/dev/null 2>&1 || true
        fi
        EXPECTED=$(gh api "$PR" --jq '.review_comments') || fail "pull request"
        stream "$PR/reviews" | jq -s '.' > "$REVIEWS" || fail "reviews"
        # Complete set, replies and outdated comments included.
        stream "$PR/comments" > "$RAW" || fail "comments"
        # Resolution state is GraphQL-only.
        gh api graphql --paginate -F owner="${REPOSITORY%/*}" -F repo="${REPOSITORY#*/}" -F pr="$PR_NUMBER" \
          --jq '.data.repository.pullRequest.reviewThreads.nodes[]' -f query='
          query($owner: String!, $repo: String!, $pr: Int!, $endCursor: String) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $pr) {
                reviewThreads(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    isResolved
                    isOutdated
                    path
                    comments(first: 100) { totalCount nodes { databaseId } }
                  }
                }
              }
            }
          }' | jq -s '.' > "$THREADS" || fail "review threads"
        # Bodies stay whole: a "won't fix" reply is the signal.
        FULL="$WORK/full.json"
        jq -n --slurpfile c "$RAW" --slurpfile r "$REVIEWS" --slurpfile t "$THREADS" '
          ([$t[0][] | . as $th | $th.comments.nodes[] |
            {key: (.databaseId | tostring),
             value: {resolved: $th.isResolved, outdated: $th.isOutdated}}] | from_entries) as $thread
          | {reviews: [$r[0][] | {id, state, user: .user.login, submitted_at, commit_id, body}],
             comments: [$c[] | ($thread[.id | tostring] // {}) as $th |
               {id, in_reply_to_id, path, line, original_line, start_line, original_start_line,
                html_url, user: .user.login,
                suppressed: ($th.resolved // false),
                outdated: ($th.outdated // false), body}]}' \
          > "$FULL" || fail "assembly"
        # Poison the index, or its count check calls a short fetch complete.
        GOT=$(jq '.comments | length' "$FULL" 2>/dev/null || echo 0)
        if [[ "$GOT" -lt "$EXPECTED" ]]; then
          warn "Fetched $GOT review comments but the pull request reports $EXPECTED."
          fail "only $GOT of $EXPECTED comments"
        fi
        # Comments past the nested page come out unsuppressed.
        OVER=$(jq '[.[] | select(.comments.totalCount > (.comments.nodes | length))] | length' "$THREADS" 2>/dev/null || echo 0)
        if [[ "$OVER" -gt 0 ]]; then
          warn "$OVER review thread(s) have more comments than one page returned, so some settled points may be treated as open."
        fi
        # Shard so no single Read truncates; index counts catch a partial read.
        : > "$WORK/index.ndjson"
        for K in reviews comments; do
          N=$(jq --arg k "$K" '.[$k] | length' "$FULL")
          S=$(( (N + PER - 1) / PER ))
          for ((i = 0; i < S; i++)); do
            jq --arg k "$K" --argjson o $((i * PER)) --argjson n "$PER" '.[$k][$o:$o+$n]' "$FULL" \
              > "$(printf '%s/%s-%02d.json' "$DIR" "$K" "$i")" || fail "shard $K $i"
          done
          FILES=$(for ((i = 0; i < S; i++)); do printf '"%s-%02d.json"\n' "$K" "$i"; done | paste -sd, -)
          jq -nc --arg k "$K" --argjson n "$N" --argjson f "[$FILES]" \
            '{($k): {count: $n, files: $f}}' >> "$WORK/index.ndjson" || fail "index $K"
          echo "Review history: $N $K in $S shard(s)."
        done
        jq -s 'add' "$WORK/index.ndjson" > "$DIR/index.json" || fail "index"

    # Claude Code saves MCP results over 50,000 characters outside the Read allowlist.
    - name: Fetch pull request diff
      id: diff
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REPOSITORY: ${{ github.repository }}
        BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        WORK: ${{ runner.temp }}/pr-diff-work
        DIR: ${{ runner.temp }}/pr-diff
      run: |
        PR="repos/$REPOSITORY/pulls/$PR_NUMBER"
        mkdir -p "$WORK" "$DIR"
        FILES="$WORK/files.json"
        warn() { echo "::warning::$*"; echo "- :warning: $*" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
        # The review says so, and the outcome check fails the job.
        fail() {
          warn "Could not read the pull request diff ($1), so the change was not reviewed."
          jq -n --arg reason "$1" '{error: $reason}' > "$DIR/index.json"
          echo "error=$1" >> "$GITHUB_OUTPUT"
          exit 0
        }
        EXPECTED=$(gh api "$PR" --jq '.changed_files') || fail "pull request"
        # The files API stops at 3000 files; the count check catches that.
        gh api --paginate --jq '.[]' "$PR/files?per_page=100" | jq -s '.' > "$FILES" || fail "files"
        N=$(jq 'length' "$FILES") || fail "files"
        if [[ "$N" -lt "$EXPECTED" ]]; then
          fail "only $N of $EXPECTED files"
        fi
        # Named by position: paths are untrusted. No patch for binary or very large files.
        jq '{count: length, files: [to_entries[] | {path: .value.filename,
          previous_path: .value.previous_filename, status: .value.status,
          additions: .value.additions, deletions: .value.deletions,
          diff: (if .value.patch then "\(.key).diff" else null end),
          base: (if .value.patch or .value.status == "added" or (.value.status == "renamed" and .value.changes == 0) then null else "\(.key).base" end)}]}' \
          "$FILES" > "$DIR/index.json" || fail "index"
        jq -r 'to_entries[] | select(.value.patch) | "\(.key)\t\(.value.patch | @base64)"' "$FILES" |
          while IFS=$'\t' read -r i p; do base64 -d <<< "$p" > "$DIR/$i.diff"; done || fail "diffs"
        BASES=$(jq -r '.files[] | select(.base)
          | "\(.base)\t\(.previous_path // .path | split("/") | map(@uri) | join("/"))"' "$DIR/index.json")
        if [[ -n "$BASES" ]]; then
          # Pull request diffs start at the merge base, not the base branch.
          MB=$(gh api "repos/$REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha) ||
            fail "merge base"
          while IFS=$'\t' read -r f p; do
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPOSITORY/contents/$p?ref=$MB" \
              > "$DIR/$f" || fail "$f"
          done <<< "$BASES"
        fi
        echo "Diff: $N files, $(jq '[.files[] | select(.diff)] | length' "$DIR/index.json") with a patch."

    - name: Run Claude Code Review
      id: claude
      if: ${{ steps.trust.outputs.trusted == 'true' }}
      # The action throws on a budget cap; implicit success() would skip the next step.
      continue-on-error: true
      # TODO: Would like to pin this, but the Mozilla org allowlist requires "anthropics/claude-code-action@v1"
      uses: anthropics/claude-code-action@v1 # zizmor: ignore[unpinned-uses]
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ github.token }}
        # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
        # or https://docs.anthropic.com/en/docs/claude-code/sdk#command-line for available options.
        # Project settings come from the base branch, restored above; local settings and
        # any .mcp.json in the workspace are ignored.
        # Agent/Task: the skill fans out. ReportFindings: it reports through that.
        # No Bash: prefix rules can't constrain flags (`git log --output=` writes files).
        # Names match github-mcp-server v0.17.1; unknown ones are silently inert.
        # A system prompt too: skill subagents never see prompt.md.
        # Path rules need the extra leading slash: a single one anchors at the workspace,
        # `//` is the filesystem root. Workspace reads are allowed anyway, so dropping it
        # silently denies just the review history, which sits outside the workspace.
        claude_args: |
          --setting-sources user,project
          --strict-mcp-config
          ${{ inputs.model && format('--model {0}', inputs.model) || '' }}
          ${{ inputs.fallback_model && format('--fallback-model {0}', inputs.fallback_model) || '' }}
          --max-budget-usd ${{ inputs.budget }}
          --append-system-prompt "There is no shell, and no base ref to diff against. The pull request's diff is in ${{ runner.temp }}/pr-diff: index.json lists every changed file and names the file in that directory holding its diff, or its prior version when there is no diff. Read it there, never from git, gh or MCP. The head commit is checked out at ${{ github.workspace }}; read surrounding code there with Read, Glob and Grep."
          --allowedTools Skill Agent Task ReportFindings
          --allowedTools "Read(/${{ github.workspace }}/**)" "Glob(/${{ github.workspace }}/**)" "Grep(/${{ github.workspace }}/**)"
          --allowedTools "Read(/${{ runner.temp }}/review-history/**)" "Read(/${{ runner.temp }}/pr-diff/**)"
          ${{ steps.web.outputs.args }}
          --allowedTools mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_review
          --allowedTools mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_files,mcp__github__get_pull_request_status,mcp__github__list_pull_requests,mcp__github__search_pull_requests
          --allowedTools mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__list_issues,mcp__github__search_issues,mcp__github__list_discussions,mcp__github__get_discussion,mcp__github__get_discussion_comments,mcp__github__list_discussion_categories
          --allowedTools mcp__github__get_commit,mcp__github__list_commits,mcp__github__get_me,mcp__github__get_workflow_run,mcp__github__list_workflow_runs,mcp__github__list_workflow_jobs,mcp__github__search_code,mcp__github__search_repositories
          --allowedTools mcp__github__get_file_contents,mcp__github__list_branches,mcp__github__list_releases,mcp__github__get_latest_release,mcp__github__get_release_by_tag,mcp__github__list_tags,mcp__github__get_tag
        prompt: ${{ steps.prompt.outputs.content }}

    # Event is a literal here. Runs after failure so a partial review still posts.
    - name: Submit review
      id: submit
      if: ${{ !cancelled() && steps.trust.outputs.trusted == 'true' && steps.claude.outcome != 'skipped' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        REPOSITORY: ${{ github.repository }}
        OUTCOME: ${{ steps.claude.outcome }}
        DIFF_ERROR: ${{ steps.diff.outputs.error }}
        LOG: ${{ runner.temp }}/claude-execution-output.json
      run: |
        PR="repos/$REPOSITORY/pulls/$PR_NUMBER"
        # A failed listing must not read as "nothing to submit": the review is still pending.
        if ! PENDING=$(gh api --paginate "$PR/reviews" --jq '.[] | select(.state == "PENDING") | .id'); then
          echo "::error::Could not list reviews on $PR. A composed review may still be pending; re-run the job."
          exit 1
        fi
        # --paginate runs --jq per page; take the last value.
        ID=$(tail -n1 <<< "$PENDING")
        # Last top-level message; subagent reports aren't the body.
        BODY=$(jq -r '[.[] | select(.type == "assistant" and (.parent_tool_use_id // null) == null)
          | .message.content[]? | select(.type == "text") | .text] | last // ""' "$LOG" 2>/dev/null || echo "")
        # Match the sentinel through any decoration.
        case "$(tr -dc '[:alnum:]' <<< "$BODY" | tr '[:lower:]' '[:upper:]')" in
        "" | NOREVIEWBODY) BODY="" ;;
        esac
        CMTS=0
        if [[ -n "$ID" ]]; then
          # Unknown, not zero: a pending review the listing failed on may still hold findings.
          if LIST=$(gh api --paginate "$PR/reviews/$ID/comments" --jq '.[].id'); then
            CMTS=$(awk 'NF' <<< "$LIST" | wc -l | tr -d ' ')
          else
            CMTS=unknown
          fi
        fi
        # Every run posts a review, so a silent job cannot be mistaken for a clean one.
        # Only a counted zero claims there were no findings.
        if [[ -z "$BODY" ]]; then
          if [[ "$CMTS" == 0 ]]; then BODY="_No findings._"; else BODY="_No whole-change observations._"; fi
        fi
        if [[ "$OUTCOME" != "success" ]]; then
          BODY="$BODY"$'\n\n'"> [!WARNING]"$'\n'"> Review did not finish (\`$OUTCOME\`); it may be incomplete."
        fi
        if [[ -n "$DIFF_ERROR" ]]; then
          BODY="$BODY"$'\n\n'"> [!WARNING]"$'\n'"> The diff could not be read (\`$DIFF_ERROR\`), so the change was not reviewed."
        fi
        if [[ -n "$ID" ]]; then
          # Submitting a review Claude left pending keeps its inline comments.
          URL=$(gh api --method POST "$PR/reviews/$ID/events" -f event=COMMENT -f body="$BODY" --jq .html_url) || {
            # Leave it pending: the next run clears it.
            echo "::error::Could not submit review $ID. The review is still pending; re-run the job."
            exit 1
          }
        else
          URL=$(gh api --method POST "$PR/reviews" -f event=COMMENT -f body="$BODY" --jq .html_url) || {
            echo "::error::Could not post a review on $PR."
            exit 1
          }
        fi
        echo "Posted a review with $CMTS inline comment(s): $URL"
        { echo "comments=$CMTS"; echo "url=$URL"; } >> "$GITHUB_OUTPUT"

    - name: Check review outcome
      if: ${{ !cancelled() && steps.trust.outputs.trusted == 'true' }}
      shell: bash
      env:
        OUTCOME: ${{ steps.claude.outcome }}
        LOG: ${{ runner.temp }}/claude-execution-output.json
        BUDGET: ${{ inputs.budget }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        DIR: ${{ runner.temp }}/review-history
        DIFF_DIR: ${{ runner.temp }}/pr-diff
        POSTED: ${{ steps.submit.outputs.comments }}
        URL: ${{ steps.submit.outputs.url }}
      run: |
        SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
        # Also to the run summary; log warnings go unread on a green job.
        warn() { echo "::warning::$*"; echo "- :warning: $*" >> "$SUMMARY"; }
        # Diagnose before exiting non-zero.
        SUBTYPE=""
        if [[ -f "$LOG" ]]; then
          RESULT=$(jq 'map(select(.type == "result")) | last // {}' "$LOG" 2>/dev/null || echo '{}')
          COST=$(jq -r '.total_cost_usd // empty' <<< "$RESULT" 2>/dev/null || true)
          TURNS=$(jq -r '.num_turns // empty' <<< "$RESULT" 2>/dev/null || true)
          SECS=$(jq -r 'if .duration_ms then (.duration_ms / 1000 | round | tostring) else empty end' <<< "$RESULT" 2>/dev/null || true)
          SUBTYPE=$(jq -r '.subtype // empty' <<< "$RESULT" 2>/dev/null || true)
          # A green job that posts nothing must still say what it did.
          {
            echo "### Claude review"
            echo ""
            echo "- Claude step: \`$OUTCOME\`${SUBTYPE:+ (\`$SUBTYPE\`)}"
            echo "- Review posted: ${URL:-none} (${POSTED:-0} inline comments)"
            echo "- ${TURNS:-?} turns, ${SECS:-?}s, \$${COST:-?} of \$$BUDGET"
          } >> "$SUMMARY"
          # Prefix match: the budget subtype is undocumented.
          if [[ "$SUBTYPE" == error_max_budget* ]]; then
            warn "Claude stopped at the \$$BUDGET budget cap, so the review is truncated. Raise the 'budget' input."
          fi
          DENIALS=$(jq -r '.permission_denials // [] | length' <<< "$RESULT" 2>/dev/null || echo 0)
          if [[ "$DENIALS" -gt 0 ]]; then
            TOOLS=$(jq -r '.permission_denials // [] | .[].tool_name' <<< "$RESULT" 2>/dev/null | sort -u | tr '\n' ',')
            warn "Claude had $DENIALS permission denial(s) — review may be incomplete. Denied tools: ${TOOLS%,}"
            echo "::group::Permission denial details"
            jq -r '.permission_denials // [] | .[] |
              if .tool_name == "Bash" then
                "  Bash: " + ((.tool_input.command // "(unknown)") | gsub("\n"; "\\n"))
              else
                "  " + .tool_name + ": " + (.tool_input | tojson)
              end' <<< "$RESULT" 2>/dev/null || true
            echo "::endgroup::"
          fi
          USES=$(jq '[.[] | select(.type == "assistant") | .message.content[]? |
            select(.type == "tool_use")]' "$LOG" 2>/dev/null || echo '[]')
          # Names only: the action hides Claude's output, so this is the record of what it did.
          echo "::group::Tool calls"
          jq -r '.[] | .name // empty' <<< "$USES" 2>/dev/null | sort | uniq -c | sort -rn || true
          echo "::endgroup::"
          # Every jq defaults: a malformed log must not fail a posted review.
          SKILL_CALLS=$(jq --arg pr "$PR_NUMBER" '[.[] | select((.name // "") == "Skill"
            and (.input.skill // "") == "code-review"
            and ((.input.args // "") | contains($pr)))] | length' <<< "$USES" 2>/dev/null || echo 0)
          POSTS=$(jq '[.[] | select((.name // "")
            | endswith("add_comment_to_pending_review"))] | length' <<< "$USES" 2>/dev/null || echo 0)
          if [[ "$POSTS" -gt 0 && "$SKILL_CALLS" -eq 0 ]]; then
            warn "Claude wrote a review without invoking the code-review skill on pull request $PR_NUMBER, so the correctness pass was skipped."
          fi
          # The skill's recipe reaches for git and gh; denied means no findings.
          if [[ "$SKILL_CALLS" -gt 0 && "$DENIALS" -gt 0 ]]; then
            warn "The code-review skill ran with $DENIALS denial(s), so the correctness pass may have produced nothing. Check the denied tools above."
          fi
          # Distinct files read under a fetched directory, its index aside.
          reads_under() {
            jq --arg d "$1/" '[.[] | select((.name // "") == "Read")
              | (.input.file_path // "")
              | select(startswith($d) and (endswith("index.json") | not))] | unique | length' \
              <<< "$USES" 2>/dev/null || echo 0
          }
          SHARDS=$(jq -r '[.[] | .files // []] | flatten | length' "$DIR/index.json" 2>/dev/null || echo 0)
          READ_SHARDS=$(reads_under "$DIR")
          # A skipped pull request reads nothing.
          if [[ "$SKILL_CALLS" -gt 0 && "$READ_SHARDS" -lt "$SHARDS" ]]; then
            warn "Claude read $READ_SHARDS of the $SHARDS review-history files, so the suppression ledger was built from a partial history."
          fi
          DIFFS=$(jq '[.files[]? | .diff, .base | select(.)] | length' "$DIFF_DIR/index.json" 2>/dev/null || echo 0)
          READ_DIFFS=$(reads_under "$DIFF_DIR")
          if [[ "$SKILL_CALLS" -gt 0 && "$READ_DIFFS" -lt "$DIFFS" ]]; then
            warn "Claude read $READ_DIFFS of the $DIFFS diff files, so part of the change went unreviewed."
          fi
          BAD_EVENT=$(jq -r '[.[] | select((.name // "")
            | endswith("submit_pending_pull_request_review"))
            | .input.event // "COMMENT" | select(. != "COMMENT")] | join(",")' \
            <<< "$USES" 2>/dev/null || echo "")
          # Already denied by the allowlist, so warn only.
          if [[ -n "$BAD_EVENT" ]]; then
            warn "Claude tried to submit a review with event '$BAD_EVENT', which prompt.md forbids and the allowlist denies. Possible prompt injection."
          fi
        fi
        # A review without the diff must not pass as a clean one.
        DIFF_ERR=$(jq -r '.error // empty' "$DIFF_DIR/index.json" 2>/dev/null || echo "no index")
        if [[ -n "$DIFF_ERR" ]]; then
          echo "::error::The pull request diff was unavailable ($DIFF_ERR), so the change was not reviewed."
          exit 1
        fi
        # The conclusion output is unset when the action throws.
        # A budget cap is expected.
        if [[ "$OUTCOME" == "failure" && "$SUBTYPE" != error_max_budget* ]]; then
          echo "Claude execution failed." >&2
          exit 1
        fi
